name: Build Plugin Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Package plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(grep -E '^[[:space:]]*\* Version:' perfect-hot-tub-finder/perfect-hot-tub-finder.php | head -n 1 | sed -E 's/.*Version:[[:space:]]*//')"
            RELEASE_TAG="v${VERSION}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Could not read plugin version." >&2
            exit 1
          fi

          ZIP_NAME="perfect-hot-tub-finder-${VERSION}-install.zip"
          zip -r "$ZIP_NAME" perfect-hot-tub-finder \
            -x "perfect-hot-tub-finder/.git/*" \
            -x "perfect-hot-tub-finder/.github/*" \
            -x "perfect-hot-tub-finder/node_modules/*"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$ZIP_NAME" \
              --title "Perfect Hot Tub Finder ${VERSION}" \
              --notes "Plugin update ${VERSION}." \
              --target "$GITHUB_SHA"
          fi
